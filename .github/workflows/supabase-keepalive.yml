name: Supabase Keepalive

# Supabase 무료 플랜은 7일간 활동이 없으면 프로젝트를 자동으로 일시정지시킨다.
# 이 워크플로우가 3일마다 가벼운 조회 요청을 보내서 그런 일이 없도록 한다.
on:
  schedule:
    - cron: '0 0 */3 * *'   # 3일마다 자정(UTC)에 실행 — 7일 제한보다 넉넉한 여유
  workflow_dispatch: {}      # Actions 탭에서 수동으로도 즉시 실행 가능

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: site_content 테이블에 가벼운 조회 요청 보내기
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/site_content?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null
          echo "Supabase에 활동 신호를 보냈습니다."
