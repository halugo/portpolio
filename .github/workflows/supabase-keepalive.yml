name: Supabase Keepalive

# Supabase 무료 플랜은 "7일 안에 한 번이라도 활동이 있으면 OK"가 아니라,
# "일주일 내내 매일 꾸준히 요청이 있어야" 안전하다 (공식 문서: 매일 몇 건씩 필요).
# 그래서 3일 간격이 아니라 매일 실행하도록 변경.
on:
  schedule:
    - cron: '0 3 * * *'    # 매일 UTC 03:00 (한국시간 정오 12시)
    - cron: '0 15 * * *'   # 매일 UTC 15:00 (한국시간 자정 0시) — 하루 2번으로 이중 안전장치
  workflow_dispatch: {}     # Actions 탭에서 수동으로도 즉시 실행 가능

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: site_content 테이블에 가벼운 조회 요청 보내기
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/site_content?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null
          echo "Supabase에 활동 신호를 보냈습니다."
