<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 로그인</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --primary:#2563eb; --text-primary:#0f172b; --text-secondary:#62748e;
    --border:#e2e8f0; --bg-page:#f6f8fb; --danger:#dc2626; --danger-bg:#fef2f2;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Pretendard', sans-serif; background:var(--bg-page); color:var(--text-primary);
  }
  form{
    width:100%; max-width:360px; background:#fff; border:1px solid var(--border);
    border-radius:16px; padding:40px 32px; box-shadow:0 20px 50px rgba(15,23,42,.08);
  }
  h1{ font-size:20px; font-weight:700; margin:0 0 28px; }
  label{ display:block; font-size:13px; font-weight:500; color:var(--text-secondary); margin-bottom:6px; }
  input{
    width:100%; padding:11px 14px; border:1px solid var(--border); border-radius:8px;
    font-size:15px; font-family:inherit; margin-bottom:18px;
  }
  input:focus{ outline:2px solid var(--primary); outline-offset:1px; }
  button{
    width:100%; padding:12px; border:none; border-radius:8px; background:var(--primary);
    color:#fff; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer;
  }
  button:disabled{ opacity:.6; cursor:not-allowed; }
  .error{
    display:none; margin-bottom:16px; padding:10px 14px; border-radius:8px;
    background:var(--danger-bg); color:var(--danger); font-size:13px;
  }
  .error.is-visible{ display:block; }
</style>
</head>
<body>
  <form id="login-form" novalidate>
    <h1>관리자 로그인</h1>
    <p class="error" id="error-msg"></p>
    <label for="username">아이디</label>
    <input type="text" id="username" name="username" autocomplete="username" required>
    <label for="password">비밀번호</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit" id="submit-btn">로그인</button>
  </form>

<script>
  const form = document.getElementById('login-form');
  const errorMsg = document.getElementById('error-msg');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.remove('is-visible');
    submitBtn.disabled = true;
    submitBtn.textContent = '로그인 중...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorMsg.textContent = data.error || '로그인에 실패했습니다.';
        errorMsg.classList.add('is-visible');
        return;
      }
      window.location.href = '/admin/dashboard.html';
    } catch {
      errorMsg.textContent = '네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
      errorMsg.classList.add('is-visible');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '로그인';
    }
  });
</script>
</body>
</html>
